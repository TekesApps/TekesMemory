[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tekesmemory"
version = "0.1.0"
description = "Independent local MCP memory service and Kernel lifecycle adapter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tekes-memory = "tekesmemory.cli:main"
tekes-memory-kernel = "tekesmemory.adapter:main"

[tool.setuptools.packages.find]
include = ["tekesmemory*"]
