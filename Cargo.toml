[package]
name = "tekes-memory"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Independent local MCP memory service and Kernel lifecycle extension"
license = "MIT"
repository = "https://github.com/TekesApps/TekesMemory"
readme = "README.md"
keywords = ["mcp", "memory", "agent", "sqlite"]
categories = ["command-line-utilities", "database"]
exclude = ["archive/**", "tests/**", "examples/**"]

[lib]
name = "tekes_memory"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
hmac = "0.12"
libc = "0.2"
plist = "1.9"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
